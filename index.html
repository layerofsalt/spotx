<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Spot X</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

<style>
  html,body{height:100%;margin:0;background:#021425;color:#dff7fb;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
  #map{width:100%;height:100vh}
  .watermark{position:absolute;top:8px;right:14px;z-index:1200;opacity:0.15;font-weight:700;font-size:1.4rem;pointer-events:none}
  .footer{position:absolute;right:12px;bottom:8px;z-index:1200;opacity:0.6;font-size:0.8rem}
  .leaflet-popup-content-wrapper{background:#021425;color:#e8fbff;border-radius:8px}
  .leaflet-popup-tip{background:#021425}
  .spotx-strong{filter:drop-shadow(0 0 10px rgba(50,255,100,0.4))}
  .spotx-medium{filter:drop-shadow(0 0 8px rgba(255,220,100,0.25))}
  .spotx-weak{filter:drop-shadow(0 0 6px rgba(255,80,80,0.25))}
</style>
</head>
<body>
<div id="map"></div>
<div class="watermark">Spot X</div>
<div class="footer">Data: Open-Meteo • Spot X © 2025</div>

<script>
const map=L.map('map',{preferCanvas:true,zoomControl:true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:18}).addTo(map);
let markers=[];

// geolocation start
function startAt(lat,lon){map.setView([lat,lon],8);loadSpots(lat,lon);}
if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(p=>startAt(p.coords.latitude,p.coords.longitude),
                                           ()=>startAt(-28.1667,153.5333),
                                           {timeout:8000});
}else startAt(-28.1667,153.5333);

// main function
async function loadSpots(lat,lon){
  markers.forEach(m=>map.removeLayer(m));markers=[];
  try{
   const res = await fetch('/spotx/spots.json')
    const user=turf.point([lon,lat]);
    let near=spots.filter(s=>turf.distance(user,turf.point([s.lon,s.lat]))<=200);
    if(near.length===0) near=spots;
    for(const s of near){
      const f=await getForecast(s.lat,s.lon);
      const score=calcScore(f,s.aspect);
      const color=score>7.5?'#33cc33':score>4?'#ffcc00':'#ff4444';
      const mark=L.circleMarker([s.lat,s.lon],{radius:8,color,fillColor:color,fillOpacity:0.9,weight:1}).addTo(map);
      mark.bindPopup(
        `<b>${s.name}</b><br>
        Swell: ${f.swellHeight.toFixed(1)} m @ ${f.swellPeriod.toFixed(1)} s (${f.swellDir}°)<br>
        Wind: ${f.windSpeedKnots.toFixed(1)} kt @ ${f.windDir}°<br>
        Tide: ${f.tide}<br>
        <b>Score ${score.toFixed(1)}/10</b>`
      );
      const el=mark.getElement();
      if(el){
        if(score>7.5)el.classList.add('spotx-strong');
        else if(score>4)el.classList.add('spotx-medium');
        else el.classList.add('spotx-weak');
      }
      markers.push(mark);
    }
  }catch(e){console.error(e);}
}

// forecast
async function getForecast(lat,lon){
  const r=await fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&hourly=swell_wave_height,swell_wave_period,swell_wave_direction,wind_speed_10m,wind_direction_10m&forecast_days=1&timezone=auto`);
  const j=await r.json();
  const H=j.hourly.swell_wave_height||[],P=j.hourly.swell_wave_period||[],D=j.hourly.swell_wave_direction||[],
        W=j.hourly.wind_speed_10m||[],WD=j.hourly.wind_direction_10m||[];
  const swellHeight=avg(H),swellPeriod=avg(P),swellDir=Math.round(avg(D));
  const windSpeedKnots=avg(W)*1.944,windDir=Math.round(avg(WD));
  const tide=['Rising','High','Falling','Low'][Math.floor(Math.random()*4)];
  return{swellHeight,swellPeriod,swellDir,windSpeedKnots,windDir,tide};
}
function avg(a){return a.length?a.reduce((x,y)=>x+(y||0),0)/a.length:0;}

function windRating(a,wD,wS){
  let d=Math.abs(a-((wD+180)%360));if(d>180)d=360-d;
  let r=d<30?3:d<60?2:d<100?0:d<140?-1:-3;
  if(wS>20)r-=1;if(wS<5)r+=1;
  return Math.max(-3,Math.min(3,r));
}
function calcScore(f,a){
  const pow=f.swellHeight*f.swellHeight*f.swellPeriod;
  const swellScore=Math.min(4,pow/150);
  const windQ=(windRating(a,f.windDir,f.windSpeedKnots)+3)/6*3;
  const sizeScore=Math.min(2,f.swellHeight/2);
  const tideScore=(f.tide==='Rising'||f.tide==='High')?1:0.5;
  return Math.min(10,swellScore+windQ+sizeScore+tideScore);
}

// re-load when panning (optional)
map.on('moveend',()=>{const c=map.getCenter();loadSpots(c.lat,c.lng)});
</script>
</body>
</html>
