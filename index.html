<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spot X – Global Surf Forecast</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { font-family:'Inter',sans-serif; background:#0d1117; color:#c9d1d9; }
    #map { height:400px; border-radius:0.75rem; }
    .data-card { background:#161b22; border:1px solid #30363d; }
    .metric-label { text-transform:uppercase; font-size:0.75rem; color:#9ca3af; }
    .metric-value { font-weight:600; }
    .spinner {
      border:4px solid rgba(255,255,255,0.1);
      border-left-color:#fff;
      border-radius:50%;
      width:1.25rem; height:1.25rem;
      animation:spin 1s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body class="p-4 md:p-8">
  <div class="max-w-4xl mx-auto">
    <header class="text-center mb-8">
      <h1 class="text-4xl font-extrabold text-blue-400">Spot X Explorer</h1>
      <p class="text-sm mt-2 text-gray-400">Global marine forecast. Auto-detects your location or choose any global spot.</p>
    </header>

    <div id="map" class="mb-8"></div>

    <div class="data-card p-4 rounded-xl mb-6">
      <h2 class="text-xl font-bold mb-3 text-blue-300">Select Surf Spot</h2>
      <select id="spot-selector" class="w-full p-2 rounded-lg bg-gray-700 border border-gray-600 text-white">
      </select>
    </div>

    <div class="data-card p-4 rounded-xl mb-6">
      <h2 class="text-xl font-bold mb-3 text-blue-300">Selected Coordinates</h2>
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div><p class="metric-label">Latitude</p><p id="lat-output" class="metric-value text-white">-28.17</p></div>
        <div><p class="metric-label">Longitude</p><p id="lng-output" class="metric-value text-white">153.55</p></div>
      </div>
      <button id="locate-button" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded-lg flex items-center justify-center space-x-2">
        <span>📍 Re-Center to My Location</span>
      </button>
    </div>

    <div class="data-card p-4 rounded-xl">
      <h2 class="text-xl font-bold mb-4 text-blue-300">3-Day Forecast</h2>
      <div id="day-tabs" class="flex gap-2 mb-4 border-b border-gray-700 pb-2"></div>
      <div id="forecast-data"><div class="text-center py-6 text-gray-500">Loading...</div></div>
      <button id="fetch-button" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-lg">Refresh Forecast</button>
    </div>
  </div>

  <div id="message-box" class="fixed bottom-4 right-4 bg-red-800 text-white p-3 rounded-lg shadow-2xl hidden"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  const MARINE_API="https://marine-api.open-meteo.com/v1/marine";
  const SURF_SPOTS=[
    {name:"Snapper Rocks",lat:-28.169,lng:153.555},
    {name:"Burleigh Heads",lat:-28.094,lng:153.454},
    {name:"Byron Bay",lat:-28.608,lng:153.616},
    {name:"Lennox Head",lat:-28.790,lng:153.606},
    {name:"Noosa Heads",lat:-26.390,lng:153.111},
    {name:"Bells Beach",lat:-38.375,lng:144.331},
    {name:"Margaret River",lat:-33.990,lng:114.997},
    {name:"Pipeline, Hawaii",lat:21.664,lng:-158.051},
    {name:"Nazare, Portugal",lat:39.601,lng:-9.079},
    {name:"Jeffreys Bay, SA",lat:-34.072,lng:24.939},
    {name:"Cloudbreak, Fiji",lat:-17.818,lng:177.161},
    {name:"Teahupo'o, Tahiti",lat:-17.838,lng:-149.267}
  ];

  const map=L.map('map').setView([-28.169,153.555],10);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
    maxZoom:18, attribution:'Data © Open-Meteo • Spot X 2025'
  }).addTo(map);

  let marker=L.marker([-28.169,153.555],{draggable:true}).addTo(map);
  const latOut=document.getElementById('lat-output'),lngOut=document.getElementById('lng-output');
  const forecastEl=document.getElementById('forecast-data');
  const dayTabs=document.getElementById('day-tabs');
  const msgBox=document.getElementById('message-box');
  const selector=document.getElementById('spot-selector');

  SURF_SPOTS.forEach((s,i)=>{
    const opt=document.createElement('option');
    opt.value=i;opt.textContent=s.name;
    selector.appendChild(opt);
  });

  function showMessage(msg,good=false){
    msgBox.textContent=msg;
    msgBox.className=good?'fixed bottom-4 right-4 bg-green-600 text-white p-3 rounded-lg shadow-2xl':'fixed bottom-4 right-4 bg-red-800 text-white p-3 rounded-lg shadow-2xl';
    msgBox.style.display='block';
    setTimeout(()=>msgBox.style.display='none',3000);
  }

  // 🌊 Simulate tide phase based on local time
  function getSimulatedTidePhase(timeStr){
    const d=new Date(timeStr);
    const hrs=d.getHours()+d.getMinutes()/60;
    const phase=Math.sin((2*Math.PI*(hrs%12.42))/12.42);
    if(phase>0.7)return"High";
    if(phase>0.2)return"Rising";
    if(phase<-0.7)return"Low";
    return"Falling";
  }

  function msToKnots(ms){return(ms*1.94384).toFixed(0);}
  function mToFeet(m){return m*3.28084;}
  function degreesToCardinal(deg){
    const dirs=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
    return dirs[Math.round(deg/22.5)%16];
  }

  async function getForecast(lat,lng){
    const url=`${MARINE_API}?latitude=${lat}&longitude=${lng}&hourly=wave_height,wave_period,wave_direction,wind_speed_10m,wind_direction_10m&timezone=auto&forecast_days=3`;
    const r=await fetch(url);
    const j=await r.json();
    return j.hourly;
  }

  function renderForecast(data){
    if(!data||!data.time){forecastEl.innerHTML='<p class="text-center text-gray-400 py-4">No data.</p>';return;}
    const days={};
    data.time.forEach((t,i)=>{
      const day=t.split('T')[0];
      if(!days[day])days[day]=[];
      days[day].push({
        time:new Date(t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),
        wave:mToFeet(data.wave_height[i]).toFixed(1),
        period:data.wave_period[i],
        dir:degreesToCardinal(data.wave_direction[i]),
        wind:msToKnots(data.wind_speed_10m[i]),
        winddir:degreesToCardinal(data.wind_direction_10m[i]),
        tide:getSimulatedTidePhase(t)
      });
    });

    const dayKeys=Object.keys(days);
    dayTabs.innerHTML=dayKeys.map((d,i)=>`<button data-i="${i}" class="py-1 px-3 rounded ${i==0?'bg-blue-600 text-white':'bg-gray-700 text-gray-300'}">${new Date(d).toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'})}</button>`).join('');

    let current=0;
    function renderTable(){
      const rows=days[dayKeys[current]].map(h=>`
        <div class="grid grid-cols-6 text-center border-b border-gray-700 py-1 text-sm hover:bg-gray-800">
          <div>${h.time}</div>
          <div>${h.wave} ft</div>
          <div>${h.period.toFixed(1)} s</div>
          <div>${h.dir}</div>
          <div>${h.tide}</div>
          <div>${h.wind} kt ${h.winddir}</div>
        </div>`).join('');
      forecastEl.innerHTML=`
        <div class="grid grid-cols-6 text-center text-xs uppercase border-b border-blue-600 pb-1 text-gray-400">
          <div>Time</div><div>Wave</div><div>Period</div><div>Dir</div><div>Tide</div><div>Wind</div>
        </div>${rows}`;
    }
    renderTable();
    document.querySelectorAll('#day-tabs button').forEach(b=>b.addEventListener('click',e=>{
      current=parseInt(b.dataset.i);
      document.querySelectorAll('#day-tabs button').forEach(btn=>btn.classList='py-1 px-3 rounded bg-gray-700 text-gray-300');
      b.classList='py-1 px-3 rounded bg-blue-600 text-white';
      renderTable();
    }));
  }

  async function updateForecast(lat,lng){
    latOut.textContent=lat.toFixed(3);lngOut.textContent=lng.toFixed(3);
    const data=await getForecast(lat,lng);
    renderForecast(data);
    showMessage('Forecast updated',true);
  }

  marker.on('dragend',()=>{const p=marker.getLatLng();updateForecast(p.lat,p.lng);});
  selector.addEventListener('change',()=>{
    const s=SURF_SPOTS[selector.value];
    map.setView([s.lat,s.lng],10);
    marker.setLatLng([s.lat,s.lng]);
    updateForecast(s.lat,s.lng);
  });

  document.getElementById('fetch-button').addEventListener('click',()=>{
    const p=marker.getLatLng();
    updateForecast(p.lat,p.lng);
  });

  document.getElementById('locate-button').addEventListener('click',()=>{
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(pos=>{
        const {latitude,longitude}=pos.coords;
        map.setView([latitude,longitude],10);
        marker.setLatLng([latitude,longitude]);
        updateForecast(latitude,longitude);
      },()=>showMessage('Location denied.'));
    }else showMessage('Geolocation not supported.');
  });

  updateForecast(-28.169,153.555);
  </script>
</body>
</html>
