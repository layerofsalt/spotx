<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const map = L.map('map').setView([-28.164, 153.546], 9);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  maxZoom: 18,
  attribution: 'Data © Open-Meteo • Spot X © 2025'
}).addTo(map);

const spots = [
  { name: "Snapper Rocks", lat: -28.169, lon: 153.55 },
  { name: "Burleigh Heads", lat: -28.083, lon: 153.46 },
  { name: "Cabarita Beach", lat: -28.324, lon: 153.58 },
  { name: "Lennox Head", lat: -28.796, lon: 153.593 },
  { name: "Byron Bay", lat: -28.643, lon: 153.617 }
];

// ✅ WORKING endpoint
async function getForecast(lat, lon) {
  const url = `https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&hourly=wave_height,wave_direction,wave_period,wind_speed,wind_direction&timezone=auto`;
  const res = await fetch(url);
  const data = await res.json();
  if (!data?.hourly) throw new Error("Invalid data");
  return data.hourly;
}

async function showSpots() {
  for (const s of spots) {
    try {
      const d = await getForecast(s.lat, s.lon);
      const id = `chart_${s.name.replace(/\s/g, "_")}`;
      const popup = `
        <strong>${s.name}</strong><br>
        🌊 Swell: ${d.wave_height[0]?.toFixed(1)} m<br>
        💨 Wind: ${d.wind_speed[0]?.toFixed(1)} km/h
        <div><canvas id="${id}"></canvas></div>
      `;
      const marker = L.circleMarker([s.lat, s.lon], {
        radius: 8, color: '#ff6600', fillColor: '#ffcc00', fillOpacity: 0.9
      }).addTo(map);
      marker.bindPopup(popup);

      marker.on('popupopen', () => {
        const ctx = document.getElementById(id);
        if (!ctx) return;
        new Chart(ctx, {
          type: 'line',
          data: {
            labels: d.time.slice(0, 24).map(t => t.slice(11, 16)),
            datasets: [
              { label: 'Wave (m)', data: d.wave_height.slice(0, 24), borderColor: '#4af', fill: false },
              { label: 'Wind (km/h)', data: d.wind_speed.slice(0, 24), borderColor: '#fa4', fill: false }
            ]
          },
          options: {
            plugins: { legend: { labels: { color: '#fff' } } },
            scales: { x: { ticks: { color: '#fff' } }, y: { ticks: { color: '#fff' } } },
            elements: { point: { radius: 0 } },
            maintainAspectRatio: false
          }
        });
      });
    } catch (err) {
      console.error("Error loading", s.name, err);
    }
  }
}
showSpots();
</script>
