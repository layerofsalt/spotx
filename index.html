<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Spot X — Surf Forecast (User Local Time)</title>

  <!-- Tailwind for quick styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: Inter,system-ui,-apple-system,Segoe UI, Roboto, "Helvetica Neue", Arial; background:#07101a; color:#dbeafe; margin:0; }
    .container { max-width:1100px; margin:20px auto; padding:16px; }
    #map { height:420px; border-radius:12px; overflow:hidden; box-shadow: 0 10px 30px rgba(2,6,23,0.6); }
    .card { background:#071427; border:1px solid rgba(255,255,255,0.04); border-radius:10px; padding:12px; }
    .muted { color:#9fb3c8; }
    .spinner { border:3px solid rgba(255,255,255,0.06); border-left-color:#60a5fa; border-radius:50%; width:20px; height:20px; animation:spin 1s linear infinite; display:inline-block; vertical-align:middle; }
    @keyframes spin { to { transform:rotate(360deg);} }
    .grid-6 { display:grid; grid-template-columns: repeat(6, 1fr); gap:6px; align-items:center; }
  </style>
</head>
<body>
  <div class="container">
    <header class="mb-4">
      <h1 class="text-2xl font-bold text-sky-300">Spot X</h1>
      <p class="muted text-sm">Global surf forecast — times shown in your local timezone. Wind in <strong>km/h</strong>.</p>
    </header>

    <div id="map" class="mb-4"></div>

    <div class="card mb-4">
      <div class="flex gap-3 items-center mb-3">
        <label class="muted w-40">Select Spot</label>
        <select id="spot-selector" class="flex-1 bg-[#031423] text-white p-2 rounded border border-white/5"></select>
        <button id="locate-btn" class="ml-2 bg-sky-600 hover:bg-sky-700 text-white px-3 py-2 rounded">Use my location</button>
        <button id="refresh-btn" class="ml-2 bg-amber-600 hover:bg-amber-700 text-white px-3 py-2 rounded">Refresh</button>
      </div>

      <div class="grid grid-cols-3 gap-4 mb-2">
        <div><div class="muted text-xs">Latitude</div><div id="lat" class="font-semibold">-28.169</div></div>
        <div><div class="muted text-xs">Longitude</div><div id="lng" class="font-semibold">153.555</div></div>
        <div><div class="muted text-xs">Status</div><div id="status" class="font-semibold">Ready</div></div>
      </div>
    </div>

    <div class="card">
      <h2 class="text-lg font-semibold text-sky-200 mb-2">3-Day Hourly Forecast</h2>
      <div id="tabs" class="flex gap-2 mb-3"></div>
      <div id="forecast" class="text-sm text-slate-100">
        <div class="text-center py-8 muted">No forecast loaded yet.</div>
      </div>
    </div>
  </div>

  <!-- Leaflet + Chart.js (Chart not required but left out to keep UI light) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
  (function(){
    const MARINE_API = 'https://marine-api.open-meteo.com/v1/marine';
    const WEATHER_API = 'https://api.open-meteo.com/v1/forecast';

    // A compact curated global list — you can extend this later
    const SPOTS = [
      { name: "Snapper Rocks (QLD)", lat: -28.169, lon: 153.555 },
      { name: "Burleigh Heads (QLD)", lat: -28.094, lon: 153.454 },
      { name: "Byron Bay (NSW)", lat: -28.608, lon: 153.616 },
      { name: "Lennox Head (NSW)", lat: -28.790, lon: 153.606 },
      { name: "Noosa Heads (QLD)", lat: -26.390, lon: 153.111 },
      { name: "Bells Beach (VIC)", lat: -38.375, lon: 144.331 },
      { name: "Margaret River (WA)", lat: -33.990, lon: 114.997 },
      { name: "Pipeline (HI)", lat: 21.664, lon: -158.051 },
      { name: "Nazaré (PT)", lat: 39.601, lon: -9.079 },
      { name: "Cloudbreak (FJ)", lat: -17.818, lon: 177.161 }
    ];

    // UI elements
    const selector = document.getElementById('spot-selector');
    const locateBtn = document.getElementById('locate-btn');
    const refreshBtn = document.getElementById('refresh-btn');
    const latEl = document.getElementById('lat');
    const lngEl = document.getElementById('lng');
    const statusEl = document.getElementById('status');
    const forecastEl = document.getElementById('forecast');
    const tabsEl = document.getElementById('tabs');

    // small cache by rounded coords to avoid re-fetching same heavy data
    const forecastCache = new Map();

    // init map
    const map = L.map('map', { zoomControl:true }).setView([SPOTS[0].lat, SPOTS[0].lon], 10);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 18 }).addTo(map);
    const marker = L.marker([SPOTS[0].lat, SPOTS[0].lon], { draggable: true }).addTo(map);

    // populate selector
    SPOTS.forEach((s,i)=>{
      const o = document.createElement('option');
      o.value = i; o.text = s.name; selector.add(o);
    });

    // utils
    function showStatus(t){ statusEl.textContent = t; }
    function roundKey(lat, lon){ return `${lat.toFixed(2)},${lon.toFixed(2)}`; }
    function mpsToKmh(ms){ return (ms * 3.6); }
    function mToFeet(m){ return m * 3.28084; }
    function degToCardinal(deg){
      if(deg==null) return 'N/A';
      const dirs=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
      return dirs[Math.round(deg/22.5)%16];
    }
    function getSimulatedTidePhase(timeStr){
      try {
        const d = new Date(timeStr);
        const hrs = d.getHours() + d.getMinutes()/60;
        const phase = Math.sin((2*Math.PI*(hrs % 12.42))/12.42);
        if(phase > 0.7) return 'High';
        if(phase > 0.2) return 'Rising';
        if(phase < -0.7) return 'Low';
        return 'Falling';
      } catch { return 'N/A'; }
    }

    // Merge marine + weather hourly arrays by exact timestamp strings
    function mergeHourly(marineHourly, weatherHourly){
      if(!marineHourly || !marineHourly.time) return null;
      const windMap = new Map();
      if(weatherHourly && weatherHourly.time){
        for(let i=0;i<weatherHourly.time.length;i++){
          windMap.set(weatherHourly.time[i], {
            wind_speed_ms: weatherHourly.wind_speed_10m ? weatherHourly.wind_speed_10m[i] : null,
            wind_dir_deg:  weatherHourly.wind_direction_10m ? weatherHourly.wind_direction_10m[i] : null
          });
        }
      }
      // build combined array
      const combined = [];
      for(let i=0;i<marineHourly.time.length;i++){
        const t = marineHourly.time[i];
        const wind = windMap.get(t) || {};
        combined.push({
          time: t,
          wave_height_m: marineHourly.wave_height ? marineHourly.wave_height[i] : null,
          wave_period_s: marineHourly.wave_period ? marineHourly.wave_period[i] : null,
          wave_dir_deg: marineHourly.wave_direction ? marineHourly.wave_direction[i] : null,
          wind_speed_ms: wind.wind_speed_ms ?? null,
          wind_dir_deg: wind.wind_dir_deg ?? null,
          tide_phase: getSimulatedTidePhase(t)
        });
      }
      return combined;
    }

    // Fetch marine waves (primary) and weather wind (fallback), merge
    async function fetchMergedForecast(lat, lon){
      const cacheKey = roundKey(lat, lon);
      if(forecastCache.has(cacheKey)) {
        return forecastCache.get(cacheKey);
      }

      showStatus('Fetching marine & wind data...');
      // Two calls: marine (waves) + weather (wind)
      const marineUrl = `${MARINE_API}?latitude=${lat}&longitude=${lon}&hourly=wave_height,wave_period,wave_direction&timezone=auto&forecast_days=3`;
      const weatherUrl = `${WEATHER_API}?latitude=${lat}&longitude=${lon}&hourly=wind_speed_10m,wind_direction_10m&timezone=auto&forecast_days=3`;

      try {
        // run in parallel
        const [marineRes, weatherRes] = await Promise.all([fetch(marineUrl), fetch(weatherUrl)]);

        if(!marineRes.ok) throw new Error(`Marine API ${marineRes.status}`);
        if(!weatherRes.ok) {
          // If weather fails, we still try to proceed with marine-only (wind will be null)
          console.warn('Weather API failed:', weatherRes.status);
        }

        const marineJson = await marineRes.json();
        const weatherJson = weatherRes.ok ? await weatherRes.json() : null;

        const marineHourly = marineJson?.hourly ?? null;
        const weatherHourly = weatherJson?.hourly ?? null;

        const combined = mergeHourly(marineHourly, weatherHourly);
        forecastCache.set(cacheKey, combined);
        showStatus('Data loaded');
        return combined;
      } catch (err) {
        console.error('Fetch error', err);
        showStatus('Error loading data');
        return null;
      }
    }

    // Render UI: group by day and show tabs + hourly rows
    function renderCombined(combined){
      if(!combined || combined.length===0){
        forecastEl.innerHTML = '<div class="text-center py-8 muted">No forecast available for this location.</div>';
        tabsEl.innerHTML = '';
        return;
      }

      // group by date (local)
      const days = {};
      combined.forEach(item => {
        const localDate = new Date(item.time);
        const dateKey = localDate.toISOString().split('T')[0];
        if(!days[dateKey]) days[dateKey] = [];
        days[dateKey].push(item);
      });

      const dayKeys = Object.keys(days).slice(0,3); // up to 3 days
      tabsEl.innerHTML = dayKeys.map((d,i) => {
        const label = new Date(d).toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
        return `<button data-idx="${i}" class="px-3 py-1 rounded ${i===0 ? 'bg-sky-600 text-white':'bg-slate-700 text-slate-200'}">${label}</button>`;
      }).join('');

      let currentIdx = 0;
      function renderDay(idx){
        const rows = days[dayKeys[idx]].map(hour => {
          const localTime = new Date(hour.time).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
          const waveFt = hour.wave_height_m != null ? mToFeet(hour.wave_height_m).toFixed(1) + ' ft' : 'N/A';
          const period = hour.wave_period_s != null ? hour.wave_period_s.toFixed(1) + ' s' : 'N/A';
          const swellDir = hour.wave_dir_deg != null ? degToCardinal(hour.wave_dir_deg) : 'N/A';
          const tide = hour.tide_phase;
          const windKmh = hour.wind_speed_ms != null ? Math.round(mpsToKmh(hour.wind_speed_ms)) + ' km/h' : 'N/A';
          const windDir = hour.wind_dir_deg != null ? degToCardinal(hour.wind_dir_deg) : 'N/A';
          return `
            <div class="grid grid-cols-6 gap-2 py-2 border-b border-slate-700 items-center text-sm">
              <div class="text-sky-200 font-medium">${localTime}</div>
              <div>${waveFt}</div>
              <div>${period}</div>
              <div>${swellDir}</div>
              <div class="text-amber-300 font-semibold">${tide}</div>
              <div>${windKmh} · ${windDir}</div>
            </div>
          `;
        }).join('');
        forecastEl.innerHTML = `
          <div class="grid grid-cols-6 gap-2 text-xs uppercase pb-2 border-b border-slate-600 text-slate-300">
            <div>Time</div><div>Wave</div><div>Period</div><div>Dir</div><div>Tide</div><div>Wind</div>
          </div>
          ${rows}
        `;
        // set tab styles
        document.querySelectorAll('#tabs button').forEach((b,i)=> {
          if(i===idx) b.className = 'px-3 py-1 rounded bg-sky-600 text-white';
          else b.className = 'px-3 py-1 rounded bg-slate-700 text-slate-200';
        });
      }

      // attach tab listeners
      setTimeout(()=> {
        document.querySelectorAll('#tabs button').forEach(btn => {
          btn.addEventListener('click', (e) => {
            currentIdx = parseInt(btn.dataset.idx);
            renderDay(currentIdx);
          });
        });
      }, 0);

      // initial render
      renderDay(0);
    }

    // helpers to update UI and fetch
    async function loadFor(lat, lon, updateMarker=true, center=true){
      latEl.textContent = lat.toFixed(4);
      lngEl.textContent = lon.toFixed(4);
      if(updateMarker) marker.setLatLng([lat, lon]);
      if(center) map.setView([lat, lon], 10);
      showStatus('Loading...');
      const combined = await fetchMergedForecast(lat, lon);
      renderCombined(combined);
    }

    // events
    marker.on('dragend', async ()=> {
      const p = marker.getLatLng();
      // throttle simple: disable UI for a second
      showStatus('Marker moved — fetching');
      await loadFor(p.lat, p.lng, false, false);
    });

    selector.addEventListener('change', ()=> {
      const s = SPOTS[selector.value];
      marker.setLatLng([s.lat, s.lon]);
      loadFor(s.lat, s.lon);
    });

    refreshBtn.addEventListener('click', ()=> {
      const p = marker.getLatLng();
      loadFor(p.lat, p.lng, false, false);
    });

    locateBtn.addEventListener('click', ()=> {
      if(!navigator.geolocation) { showStatus('Geolocation unavailable'); return; }
      showStatus('Locating...');
      navigator.geolocation.getCurrentPosition(pos => {
        const { latitude, longitude } = pos.coords;
        marker.setLatLng([latitude, longitude]);
        loadFor(latitude, longitude);
      }, err => {
        console.warn(err);
        showStatus('Location denied or failed');
      }, { enableHighAccuracy:true, timeout:7000 });
    });

    // init
    (function init(){
      // fill selector and set default
      SPOTS.forEach((s,i)=> { selector.options[i] = new Option(s.name, i); });
      selector.selectedIndex = 0;
      // initial load for default spot
      loadFor(SPOTS[0].lat, SPOTS[0].lon);
    })();

  })();
  </script>
</body>
</html>
