<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spot X</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #001f3f; }
  #map { height: 100%; width: 100%; }
  .leaflet-container { background: #001f3f; }
  .leaflet-popup-content-wrapper { background: #001f3f; color: #fff; border-radius: 8px; }
  .leaflet-popup-tip { background: #001f3f; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map', { zoomControl: false }).setView([0, 0], 2);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 18,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  fetch('spots.json')
    .then(res => res.json())
    .then(spots => {
      spots.forEach(s => {
        const marker = L.circleMarker([s.lat, s.lon], {
          radius: 5,
          color: '#00bfff',
          fillColor: '#00bfff',
          fillOpacity: 0.8
        }).addTo(map);
        marker.bindPopup(`<b>${s.name}</b>`);
      });
    });

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      const { latitude, longitude } = pos.coords;
      map.setView([latitude, longitude], 6);
      L.circleMarker([latitude, longitude], {
        radius: 7,
        color: '#ffcc00',
        fillColor: '#ffcc00',
        fillOpacity: 1
      }).addTo(map).bindPopup("You are here");
    });
  }
</script>
</body>
</html>
