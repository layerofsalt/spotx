<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spot X – Global Surf Forecast</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

<style>
html, body {
  margin: 0;
  height: 100%;
  background: #001f33;
  font-family: system-ui, sans-serif;
  color: white;
}
#map { height: 100%; width: 100%; }
.watermark {
  position: absolute;
  top: 12px; right: 18px;
  font-size: 1.5em;
  color: #ffffffcc;
  font-weight: 700;
  text-shadow: 0 0 8px #00aaff;
  z-index: 1000;
}
#footer {
  position: absolute;
  bottom: 10px; right: 12px;
  font-size: 0.8em;
  color: #ffffff88;
  z-index: 1000;
}
</style>
</head>
<body>
<div id="map"></div>
<div class="watermark">Spot X</div>
<div id="footer">Data from Open-Meteo • Spot X © 2025</div>

<script>
// Initialize map
const map = L.map('map', {
  zoomControl: false
});
L.control.zoom({ position: 'bottomright' }).addTo(map);

// Dark navy basemap
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '',
  maxZoom: 18
}).addTo(map);

// Geolocation
navigator.geolocation.getCurrentPosition(success, fallback);

function success(pos) {
  const { latitude, longitude } = pos.coords;
  map.setView([latitude, longitude], 10);
  loadSpots(latitude, longitude);
}

function fallback() {
  const lat = -28.1667, lon = 153.5333; // default: Snapper Rocks
  map.setView([lat, lon], 10);
  loadSpots(lat, lon);
}

// Generate random spots nearby
function generateRandomSpots(lat, lon, count = 12, radius = 50) {
  const spots = [];
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * 2 * Math.PI;
    const distance = Math.random() * radius;
    const offset = turf.destination(turf.point([lon, lat]), distance, angle, { units: 'kilometers' }).geometry.coordinates;
    spots.push({
      name: `Spot ${i + 1}`,
      lat: offset[1],
      lon: offset[0],
      aspect: Math.floor(Math.random() * 360)
    });
  }
  return spots;
}

// Load and render spots
async function loadSpots(lat, lon) {
  const spots = generateRandomSpots(lat, lon);
  for (const s of spots) {
    try {
      const data = await getForecast(s.lat, s.lon);
      const score = calcCompositeScore(data, s.aspect);
      const color = score > 7.5 ? '#00ff99' : score > 4 ? '#ffaa00' : '#ff4444';

      const marker = L.circleMarker([s.lat, s.lon], {
        radius: 7,
        color,
        fillColor: color,
        fillOpacity: 0.7
      }).addTo(map);

      marker.bindPopup(`
        <b>${s.name}</b><br>
        Swell: ${data.swellHeight.toFixed(1)} m @ ${data.swellPeriod.toFixed(1)} s (${data.swellDir.toFixed(0)}°)<br>
        Wind: ${data.windSpeedKnots.toFixed(1)} kt @ ${data.windDir.toFixed(0)}°<br>
        <b>Score: ${score.toFixed(1)}/10</b>
      `);

      marker.getElement().style.filter = `drop-shadow(0 0 6px ${color})`;
    } catch (err) {
      console.error('Forecast error:', err);
    }
  }
}

// Forecast data from Open-Meteo
async function getForecast(lat, lon) {
  const res = await fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&hourly=swell_wave_height,swell_wave_period,swell_wave_direction,wind_speed_10m,wind_direction_10m&timezone=auto`);
  const js = await res.json();
  const h = js.hourly;
  const swellHeight = avg(h.swell_wave_height.slice(0, 12));
  const swellPeriod = avg(h.swell_wave_period.slice(0, 12));
  const swellDir = avg(h.swell_wave_direction.slice(0, 12));
  const windSpeed = avg(h.wind_speed_10m.slice(0, 12));
  const windDir = avg(h.wind_direction_10m.slice(0, 12));

  return {
    swellHeight,
    swellPeriod,
    swellDir,
    windSpeedKnots: windSpeed * 1.944,
    windDir
  };
}

function avg(arr) {
  return arr.reduce((a, b) => a + b, 0) / arr.length;
}

// Scoring logic
function getWindRating(aspect, windDir, windSpeed) {
  let diff = Math.abs(aspect - ((windDir + 180) % 360));
  if (diff > 180) diff = 360 - diff;
  let rating = 0;
  if (diff < 30) rating = 3; // offshore
  else if (diff < 60) rating = 2;
  else if (diff < 100) rating = 0;
  else if (diff < 140) rating = -1;
  else rating = -3; // onshore
  if (windSpeed > 20) rating -= 1;
  if (windSpeed < 5) rating += 1;
  return Math.max(-3, Math.min(3, rating));
}

function calcCompositeScore(d, aspect) {
  const swellPower = d.swellHeight * d.swellHeight * d.swellPeriod;
  const swellPowerScore = Math.min(4, swellPower / 150);
  const windQuality = getWindRating(aspect, d.windDir, d.windSpeedKnots) + 3;
  const windScore = (windQuality / 6) * 3;
  const sizeScore = Math.min(2, d.swellHeight / 2);
  const total = swellPowerScore + windScore + sizeScore + 1;
  return Math.min(10, total);
}
</script>
</body>
</html>
